# tmux configuration for the recorded demo only. Mirrors a real setup --
# ctrl-a prefix, a green status bar with black text -- so the screenshots
# show atc against ordinary styling rather than something built to flatter it.
set -g default-terminal "tmux-256color"
set -g escape-time 0
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

set -g status-style bg=green,fg=black
set -g status-right " %H:%M "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour240

source-file /Users/conormullaney/dev/atc/tmux/atc.conf
set -g status-left "#(/Users/conormullaney/dev/atc/target/release/atc sync)"
bind-key a display-popup -E -h "85%" -w "85%" -T " atc " "/Users/conormullaney/dev/atc/target/release/atc ui"
