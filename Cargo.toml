[package]
name = "atc"
version = "0.1.0"
edition = "2021"
description = "Air traffic control for tmux AI coding sessions"
license = "MIT"
repository = "https://github.com/CMullaney01/atc"

[profile.release]
strip = true
lto = true

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
