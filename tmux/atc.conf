# atc — fleet row and command center.
# Source this from your own tmux.conf:
#   source-file ~/dev/atc/tmux/atc.conf

# A second status row. tmux draws status-format[0] (the normal window list)
# above status-format[1], so the fleet row sits along the very bottom.
set -g status 2
set -g status-interval 2

# Row 0 keeps tmux's own window list; each window name just gains its
# aggregate glyph, read straight out of the window option the hook sets.
# This replaces window-status-format wholesale, so if you have customised it,
# splice in the #{?#{@atc_win},...} clause by hand instead of sourcing this.
set -g window-status-format "#I:#W#{?#{@atc_win},#{E:@atc_win},}#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?#{@atc_win},#{E:@atc_win},}#{?window_flags,#{window_flags}, }"

# Row 1: the fleet row. The session name is passed in so the renderer knows
# which windows are local and which belong to other sessions.
set -g status-format[1] "#[align=left] #(atc bar #{session_name})"

# Command center, same feel as prefix+g for lazygit.
bind-key a display-popup -E -h "80%" -w "80%" -T " atc " "atc ui"

# Visiting a pane drops its bold "you have ignored this" escalation, but keeps
# the state glyph until the session actually gets a reply.
set-hook -g after-select-pane 'run-shell -b "atc seen #{pane_id}"'
