# atc — fleet row and command center.
# Source this from your own tmux.conf:
#   source-file ~/dev/atc/tmux/atc.conf

# One row. tmux's own window list carries everything: it already has the
# window names, the flags and the current-window highlight, so atc adds only a
# glyph per pane inside each name. (tmux spells one row "on", not 1.)
set -g status on
set -g status-interval 2

# Nothing is printed here. atc refreshes every window's glyphs and exits, which
# tmux runs once per redraw rather than once per window. This is also where the
# states that were read off a pane's screen get in, since no hook reports those.
set -g status-left "#(atc sync)"

# Each window name gains one glyph per AI pane in it, read straight out of the
# window option. This replaces window-status-format wholesale, so if you have
# customised it, splice in the #{?#{@atc_win},...} clause by hand instead.
set -g window-status-format "#I:#W#{?#{@atc_win}, #{E:@atc_win},}#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#I:#W#{?#{@atc_win}, #{E:@atc_win},}#{?window_flags,#{window_flags}, }"

# Colour is on. Set this to off for shape and weight only, which is the thing
# to reach for if the palette fights how you have styled your bar.
# set -g @atc_colour off

# Command center, same feel as prefix+g for lazygit.
bind-key a display-popup -E -h "80%" -w "80%" -T " atc " "atc ui"

# Visiting a pane drops its bold "you have ignored this" escalation, but keeps
# the state glyph until the session actually gets a reply.
set-hook -g after-select-pane 'run-shell -b "atc seen #{pane_id}"'
